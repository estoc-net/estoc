# Build, typecheck and test the whole workspace on every pull request and on main.
# Mirrors what a developer runs locally: `pnpm install --frozen-lockfile && pnpm build && pnpm typecheck && pnpm test`.
# The browser e2e (`pnpm e2e`) needs a browser and a mediator and is run by hand.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
